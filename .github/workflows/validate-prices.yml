name: Validate prices

# Runs on every change to a price guide. A red check means the edit has a
# problem the contributor needs to fix before it can be merged.
#
# NOTE: this file must live at the REPOSITORY ROOT (.github/workflows/), even
# though the guides live under public/. GitHub only reads workflows, issue
# templates, and the PR template from the root .github/ folder.
on:
  pull_request:
    paths:
      - "public/prices.json"
      - "public/catalog.json"
      - "public/amiibo_prices.json"
      - "public/amiibo_catalog.json"
      - "public/scripts/validate_prices.py"
  push:
    branches: [main]
    paths:
      - "public/prices.json"
      - "public/catalog.json"
      - "public/amiibo_prices.json"
      - "public/amiibo_catalog.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history to compare against the base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Skylanders guide ──────────────────────────────────────────────────
      - name: Fetch base prices.json (version-bump check)
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:public/prices.json" > base_prices.json \
            || echo '{}' > base_prices.json

      - name: Validate Skylanders prices
        run: >
          python public/scripts/validate_prices.py
          --prices public/prices.json
          --catalog public/catalog.json
          ${{ github.event_name == 'pull_request' && '--base base_prices.json' || '' }}

      # ── Amiibo guide ──────────────────────────────────────────────────────
      - name: Fetch base amiibo_prices.json (version-bump check)
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:public/amiibo_prices.json" > base_amiibo_prices.json \
            || echo '{}' > base_amiibo_prices.json

      - name: Validate amiibo prices
        run: >
          python public/scripts/validate_prices.py
          --prices public/amiibo_prices.json
          --catalog public/amiibo_catalog.json
          ${{ github.event_name == 'pull_request' && '--base base_amiibo_prices.json' || '' }}
